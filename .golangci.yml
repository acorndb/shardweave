version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - misspell
    - unconvert
    - unparam
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - source: 'defer .+\.Close\(\)'
        linters:
          - errcheck
    # vendored from vitess; kept verbatim for future upstream diffs (NOTICE)
    paths:
      - pkg/mysql/collation

formatters:
  enable:
    - gofumpt
  exclusions:
    paths:
      - pkg/mysql/collation
