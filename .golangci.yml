version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - misspell
    - unconvert
    - unparam
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - source: 'defer .+\.Close\(\)'
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
