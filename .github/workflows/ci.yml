name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 单元测试(short, 无 Docker 依赖)
        run: make test-unit
      - name: 差分校准(需要 Docker, runner 自带)
        run: make test-integration

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Prebuilt binary Go version must be >= go directive in go.mod (not toolchain).
          version: v2.15.0
          args: --timeout=5m
      - name: go vet
        run: go vet ./...
