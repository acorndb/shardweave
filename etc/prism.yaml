# Example prism M1 passthrough config.
# Start: go run ./cmd/prism -config etc/prism.yaml
# Reload users/log: kill -USR1 <pid>

listen: "0.0.0.0:3307"

users:
  - name: root
    password: "root"

server:
  read_timeout: 30s
  write_timeout: 30s
  max_allowed_packet: 67108864  # 64 MiB

backend:
  mode: single
  slices:
    - name: default
      master:
        address: "127.0.0.1:3306"
        user: root
        password: "root"
        database: ""
  # rwsplit example (stub-tested; flip mode + fill master/slaves):
  # mode: rwsplit
  # slices:
  #   - name: default
  #     master:
  #       address: "127.0.0.1:3306"
  #       user: root
  #       password: "root"
  #     slaves:
  #       - address: "127.0.0.1:3307"
  #         user: root
  #         password: "root"
  # load_balance: round_robin

pool:
  capacity: 4
  max_capacity: 16
  max_idle: 16
  idle_timeout: 5m
  max_lifetime: 1h
  health_check_interval: 30s
  get_timeout: 2s
  dial_timeout: 5s
  read_timeout: 30s
  write_timeout: 30s

log:
  level: info

termination_drain: 5s
