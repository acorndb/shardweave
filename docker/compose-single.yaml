name: shardweave-single

services:
  mysql:
    image: mysql:8.0
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bench
      MYSQL_USER: app
      MYSQL_PASSWORD: app-pass-123
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - ./init/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./init/single.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

  shardweave:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["-config", "/etc/shardweave/config.yaml"]
    volumes:
      - ./conf/single.yaml:/etc/shardweave/config.yaml:ro
    ports:
      - "127.0.0.1:3307:3307"
    depends_on:
      mysql:
        condition: service_healthy
